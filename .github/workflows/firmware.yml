name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Only exercised by the release step, which runs on tags.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so the version ESP-IDF derives from
          # `git describe` matches the release tag instead of falling back.
          fetch-depth: 0

      - name: Host tests
        # Run first: they need no toolchain and no hardware, so a broken parser
        # fails in seconds rather than after a full firmware build.
        run: |
          set -eo pipefail
          cmake -S test -B build-test
          cmake --build build-test
          ctest --test-dir build-test --output-on-failure

      - name: Build firmware
        # Same IDF release as the local Dockerfile, so CI and desktop builds
        # produce the same image. Building from a clean checkout is also the
        # point: it catches settings that exist only in a developer's local
        # (gitignored) sdkconfig and were never recorded in sdkconfig.defaults.
        #
        # Warnings are errors in main/CMakeLists.txt, so a warning fails this
        # step. This used to be a grep for "warning:" over the build log, which
        # tested the log's wording rather than the build.
        run: |
          set -eo pipefail
          docker run --rm -v "$PWD:/project" -w /project \
            espressif/idf:release-v5.3 \
            sh -c 'git config --global --add safe.directory /project && idf.py build'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/neato-mqtt-controller.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # The app image is what the device pulls over OTA; the bootloader,
        # partition table and initial otadata are included so a release is also
        # enough to recover a device over serial.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            build/neato-mqtt-controller.bin \
            build/bootloader/bootloader.bin \
            build/partition_table/partition-table.bin \
            build/ota_data_initial.bin
