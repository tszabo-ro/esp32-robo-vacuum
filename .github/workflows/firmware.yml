name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Only exercised by the release step, which runs on tags.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        # Same IDF release as the local Dockerfile, so CI and desktop builds
        # produce the same image. Building from a clean checkout is also the
        # point: it catches settings that exist only in a developer's local
        # (gitignored) sdkconfig and were never recorded in sdkconfig.defaults.
        run: |
          set -eo pipefail
          docker run --rm -v "$PWD:/project" -w /project \
            espressif/idf:release-v5.3 \
            sh -c 'git config --global --add safe.directory /project && idf.py build' \
            2>&1 | tee build.log

      - name: Fail on compiler warnings
        # Agents.md treats a warning-free build as non-negotiable, so enforce it
        # here rather than relying on someone noticing in scrollback.
        run: |
          if grep -q "warning:" build.log; then
            echo "::error::Build produced compiler warnings"
            grep "warning:" build.log
            exit 1
          fi
          echo "No compiler warnings."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/neato-mqtt-controller.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # The app image is what the device pulls over OTA; the bootloader,
        # partition table and initial otadata are included so a release is also
        # enough to recover a device over serial.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            build/neato-mqtt-controller.bin \
            build/bootloader/bootloader.bin \
            build/partition_table/partition-table.bin \
            build/ota_data_initial.bin
